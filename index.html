<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Arrow Belcești</title>
    
    <link rel="icon" type="image/png" href="logo2.png?v=2">

    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden; /* Blocăm scroll-ul definitiv */
        }

        body {
            /* Fundal optimizat pentru a nu se mai mișca/strica */
            background: linear-gradient(rgba(26, 26, 26, 0.92), rgba(26, 26, 26, 0.92)), url('poza4.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            /* Împingem totul puțin mai sus ca să facem loc subsolului */
            margin-top: -30px; 
        }

        img.logo-main {
            /* Dimensiune calculată să nu ocupe mai mult de 15% din înălțime pe mobil */
            max-height: 15vh;
            width: auto;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
            margin-bottom: 3vh; 
        }

        h1 {
            font-size: clamp(1.1rem, 5vw, 1.5rem);
            margin: 0;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .highlight {
            color: #ffcc00;
        }

        p {
            margin: 10px 0 20px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(0.85rem, 4vw, 1rem);
            max-width: 320px;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 14px 30px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: pulse-animation 2s infinite;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            /* Padding pentru a evita butoanele de sistem de pe telefoane */
            padding-bottom: 5px; 
        }

        footer a { color: rgba(255, 255, 255, 0.5); text-decoration: none; }
        .fb-minimal { font-family: sans-serif; font-size: 1.1rem; font-weight: bold; }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        /* FIX PENTRU MOBIL: Ajustăm înălțimile când ecranul e mic */
        @media (max-height: 650px) {
            img.logo-main { max-height: 12vh; margin-bottom: 2vh; }
            h1 { font-size: 1rem; }
            p { margin: 5px 0 10px 0; font-size: 0.8rem; }
            .buton-puls { padding: 10px 20px; font-size: 0.8rem; }
            .content { margin-top: -10px; }
        }

        /* OVERLAY FORMULAR - Rămâne neschimbat */
        #f230-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #f230-container {
            width: 95%; max-width: 1100px; height: 92vh;
            background: #fff; border-radius: 15px;
            position: relative; overflow: hidden;
        }

        #f230-container iframe { width: 100%; height: 100%; border: none; }

        .inchide-f230 {
            position: absolute; top: 10px; right: 20px;
            font-size: 35px; color: #000; cursor: pointer;
            font-weight: bold; z-index: 10000;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="logo2.png" alt="Logo Black Arrow" class="logo-main">

        <h1>ASOCIAȚIA CLUB SPORTIV<br><span class="highlight">BLACK ARROW BELCEȘTI</span></h1>
        
        <p>Crește performanța!<br>Redirecționează 3,5% din impozit!</p>

        <button class="buton-puls" onclick="deschideFormular()">
            COMPLETEAZĂ FORMULARUL 230
        </button>
    </div>

    <footer>
        <a href="mailto:contact@blackarrow.ro">contact</a>
        <span>•</span>
        <a href="https://www.facebook.com/blackarrowbelcesti" target="_blank" class="fb-minimal">f</a>
        <span>•</span>
        <span>Black Arrow © 2026</span>
    </footer>

    <div id="f230-overlay">
        <div id="f230-container">
            <span class="inchide-f230" onclick="inchideFormular()">&times;</span>
            <iframe src="https://formular230.ro/asociatia-club-sportiv-black-arrow-belcesti"></iframe>
        </div>
    </div>

    <script>
        function deschideFormular() { document.getElementById('f230-overlay').style.display = 'flex'; }
        function inchideFormular() { document.getElementById('f230-overlay').style.display = 'none'; }
        document.addEventListener('keydown', function(e) { if (e.key === "Escape") inchideFormular(); });
        document.getElementById('f230-overlay').addEventListener('click', function(e) { if (e.target === this) inchideFormular(); });
    </script>

</body>
</html>
