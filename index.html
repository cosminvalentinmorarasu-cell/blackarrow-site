<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Arrow Belcești</title>
    
    <link rel="icon" type="image/png" href="logo2.png?v=2">

    <style>
        body {
            /* FUNDAL MODERN: Opacitate redusa (0.92) pentru discretie maxima */
            background: linear-gradient(rgba(26, 26, 26, 0.92), rgba(26, 26, 26, 0.92)), url('poza4.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Imaginea ramane fixa, oferind un efect de profunzime */
            background-repeat: no-repeat;
            background-color: #1a1a1a;
            
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            z-index: 1;
        }

        img.logo-main {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .highlight {
            color: #ffcc00;
        }

        p {
            margin-bottom: 35px;
            color: rgba(255, 255, 255, 0.7); /* Text mai fin, gri deschis */
            font-size: 1.1rem;
            max-width: 450px;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: pulse-animation 2s infinite;
            transition: all 0.3s ease;
            outline: none;
        }

        .buton-puls:hover {
            transform: translateY(-3px) scale(1.03);
            background-color: #ffd633;
            box-shadow: 0 15px 25px rgba(255, 204, 0, 0.2);
        }

        footer {
            width: 100%;
            padding: 20px 0 30px 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 1;
        }

        footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: 0.3s;
        }

        footer a:hover {
            color: #ffcc00;
        }

        .fb-minimal {
            font-family: sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* AJUSTARI PENTRU MOBIL */
        @media (max-width: 600px) {
            body {
                background-attachment: scroll; /* Pe unele telefoane "fixed" poate crea lag */
            }
            img.logo-main { max-width: 130px; }
            h1 { font-size: 1.3rem; }
            p { font-size: 0.95rem; }
            .buton-puls { padding: 16px 28px; font-size: 1rem; }
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        /* OVERLAY FORMULAR */
        #f230-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #f230-container {
            width: 95%; max-width: 1100px; height: 92vh;
            background: #fff; border-radius: 15px;
            position: relative; overflow: hidden;
        }

        #f230-container iframe { width: 100%; height: 100%; border: none; }

        .inchide-f230 {
            position: absolute; top: 10px; right: 20px;
            font-size: 35px; color: #000; cursor: pointer;
            font-weight: bold; z-index: 10000;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="logo2.png" alt="Logo Black Arrow" class="logo-main">

        <h1>ASOCIAȚIA CLUB SPORTIV<br><span class="highlight">BLACK ARROW BELCEȘTI</span></h1>
        <p>Ajută-ne să creștem performanța! Redirecționează 3,5% din impozit.</p>

        <button class="buton-puls" onclick="deschideFormular()">
            COMPLETEAZĂ FORMULARUL 230
        </button>
    </div>

    <footer>
        <a href="mailto:contact@blackarrow.ro">contact</a>
        <span>•</span>
        <a href="https://www.facebook.com/blackarrowbelcesti" target="_blank" class="fb-minimal">f</a>
        <span>•</span>
        <span>Black Arrow © 2026</span>
    </footer>

    <div id="f230-overlay">
        <div id="f230-container">
            <span class="inchide-f230" onclick="inchideFormular()">&times;</span>
            <iframe src="https://formular230.ro/asociatia-club-sportiv-black-arrow-belcesti"></iframe>
        </div>
    </div>

    <script>
        function deschideFormular() { 
            document.getElementById('f230-overlay').style.display = 'flex'; 
            document.body.style.overflow = 'hidden';
        }
        function inchideFormular() { 
            document.getElementById('f230-overlay').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }
        document.addEventListener('keydown', function(e) { if (e.key === "Escape") inchideFormular(); });
        document.getElementById('f230-overlay').addEventListener('click', function(e) { if (e.target === this) inchideFormular(); });
    </script>

</body>
</html>
