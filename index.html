<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Arrow Belcești</title>
    
    <link rel="icon" type="image/png" href="logo2.png?v=2">

    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #1a1a1a;
        }

        body {
            background: linear-gradient(rgba(26, 26, 26, 0.92), rgba(26, 26, 26, 0.92)), url('poza4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centrare standard pentru Web */
            padding: 20px;
            gap: 20px; /* Spațiu controlat între elemente pe Web */
        }

        img.logo-main {
            height: 22vh;
            max-height: 220px;
            width: auto;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
            margin-bottom: 20px; /* Aerisirea sub logo */
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            margin: 0;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .highlight { color: #ffcc00; }

        p {
            margin: 5px 0 15px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(1rem, 2.5vh, 1.1rem);
            max-width: 450px;
            line-height: 1.4;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 16px 40px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: pulse-animation 2s infinite;
            text-transform: uppercase;
        }

        footer {
            height: 60px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-shrink: 0;
        }

        footer a { color: rgba(255, 255, 255, 0.5); text-decoration: none; }
        .fb-minimal { font-family: sans-serif; font-size: 1.2rem; font-weight: bold; }

        /* AJUSTĂRI SPECIFICE PENTRU MOBIL */
        @media (max-width: 768px) {
            .content {
                justify-content: space-around; /* Spațiere dinamică doar pe mobil */
                gap: 0; 
                padding: 10px 20px;
            }
            img.logo-main {
                height: 20vh;
                margin-bottom: 10px;
            }
            p { margin-bottom: 10px; }
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        /* Overlay */
        #f230-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.96); z-index: 9999; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        #f230-container {
            width: 95%; max-width: 1100px; height: 92vh; background: #fff; border-radius: 15px;
            position: relative; overflow: hidden;
        }
        #f230-container iframe { width: 100%; height: 100%; border: none; }
        .inchide-f230 { position: absolute; top: 10px; right: 20px; font-size: 35px; color: #000; cursor: pointer; font-weight: bold; z-index: 10000; }
    </style>
</head>
<body>

    <div class="content">
        <img src="logo2.png" alt="Logo Black Arrow" class="logo-main">

        <div class="text-group">
            <h1>ASOCIAȚIA CLUB SPORTIV<br><span class="highlight">BLACK ARROW BELCEȘTI</span></h1>
            <p>Crește performanța!<br>Redirecționează 3,5% din impozit.</p>
        </div>

        <button class="buton-puls" onclick="deschideFormular()">
            COMPLETEAZĂ FORMULARUL 230
        </button>
    </div>

    <footer>
        <a href="mailto:contact@blackarrow.ro">contact</a>
        <span>•</span>
        <a href="https://www.facebook.com/blackarrowbelcesti" target="_blank" class="fb-minimal">f</a>
        <span>•</span>
        <span>Black Arrow © 2026</span>
    </footer>

    <div id="f230-overlay">
        <div id="f230-container">
            <span class="inchide-f230" onclick="inchideFormular()">&times;</span>
            <iframe src="https://formular230.ro/asociatia-club-sportiv-black-arrow-belcesti"></iframe>
        </div>
    </div>

    <script>
        function deschideFormular() { document.getElementById('f230-overlay').style.display = 'flex'; }
        function inchideFormular() { document.getElementById('f230-overlay').style.display = 'none'; }
    </script>

</body>
</html>
