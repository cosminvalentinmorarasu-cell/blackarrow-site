<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Arrow Belcești</title>
    
    <link rel="icon" type="image/png" href="logo2.png?v=2">

    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        img.logo-main {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .highlight {
            color: #ffcc00;
        }

        p {
            margin-bottom: 30px;
            color: #ccc;
            font-size: 1.1rem;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            animation: pulse-animation 2s infinite;
            transition: transform 0.2s;
        }

        /* --- FOOTER MINIMALIST --- */
        footer {
            width: 100%;
            padding-bottom: 30px;
            font-size: 0.85rem;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        footer a {
            color: #888;
            text-decoration: none;
            transition: 0.3s;
        }

        footer a:hover {
            color: #ffcc00;
        }

        /* Logo Facebook Minimalist */
        .fb-minimal {
            font-family: sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            color: #888 !important;
            line-height: 1;
            transition: 0.3s;
        }

        .fb-minimal:hover {
            color: #1877F2 !important;
        }

        @media (max-width: 600px) {
            img.logo-main { max-width: 140px; }
            h1 { font-size: 1.4rem; }
            p { font-size: 0.9rem; padding: 0 15px; }
            .buton-puls { padding: 15px 30px; font-size: 1rem; }
            footer { font-size: 0.75rem; gap: 10px; padding-bottom: 20px; }
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        #f230-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #f230-container {
            width: 95%; max-width: 1100px; height: 90vh;
            background: #fff; border-radius: 15px;
            position: relative; overflow: hidden;
        }

        #f230-container iframe { width: 100%; height: 100%; border: none; }

        .inchide-f230 {
            position: absolute; top: 10px; right: 20px;
            font-size: 35px; color: #000; cursor: pointer;
            font-weight: bold; z-index: 10000;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="logo2.png" alt="Logo Black Arrow" class="logo-main">

        <h1>ASOCIAȚIA CLUB SPORTIV<br><span class="highlight">BLACK ARROW BELCEȘTI</span></h1>
        <p>Ajută-ne să creștem! Redirecționează 3,5% din impozit.</p>

        <button class="buton-puls" onclick="deschideFormular()">
            COMPLETEAZĂ FORMULARUL 230
        </button>
    </div>

    <footer>
        <a href="mailto:contact@blackarrow.ro">contact</a>
        <span>•</span>
        <a href="https://www.facebook.com/blackarrowbelcesti" target="_blank" class="fb-minimal">f</a>
        <span>•</span>
        <span>Black Arrow © 2026</span>
    </footer>

    <div id="f230-overlay">
        <div id="f230-container">
            <span class="inchide-f230" onclick="inchideFormular()">&times;</span>
            <iframe src="https://formular230.ro/asociatia-club-sportiv-black-arrow-belcesti"></iframe>
        </div>
    </div>

    <script>
        function deschideFormular() { document.getElementById('f230-overlay').style.display = 'flex'; }
        function inchideFormular() { document.getElementById('f230-overlay').style.display = 'none'; }
        document.addEventListener('keydown', function(e) { if (e.key === "Escape") inchideFormular(); });
        document.getElementById('f230-overlay').addEventListener('click', function(e) { if (e.target === this) inchideFormular(); });
    </script>

</body>
</html>
