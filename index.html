<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Arrow Belcești</title>
    
    <link rel="icon" type="image/png" href="logo2.png">

    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        img {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .highlight {
            color: #ffcc00;
        }

        p {
            margin-bottom: 30px;
            color: #ccc;
            font-size: 1.1rem;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            animation: pulse-animation 2s infinite;
            transition: transform 0.2s;
        }

        .buton-puls:hover {
            transform: scale(1.05);
            background-color: #fff;
            animation: none;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        #f230-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #f230-container {
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            background: #fff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #f230-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .inchide-f230 {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <img src="logo2.png" alt="Logo Black Arrow">

    <h1>ASOCIAȚIA CLUB SPORTIV<br><span class="highlight">BLACK ARROW BELCEȘTI</span></h1>
    <p>Ajută-ne să creștem! Redirecționează 3,5% din impozit.</p>

    <button class="buton-puls" onclick="deschideFormular()">
        COMPLETEAZĂ FORMULARUL 230
    </button>

    <div id="f230-overlay">
        <div id="f230-container">
            <span class="inchide-f230" onclick="inchideFormular()">&times;</span>
            <iframe src="https://formular230.ro/asociatia-club-sportiv-black-arrow-belcesti"></iframe>
        </div>
    </div>

    <script>
        function deschideFormular() {
            document.getElementById('f230-overlay').style.display = 'flex';
        }

        function inchideFormular() {
            document.getElementById('f230-overlay').style.display = 'none';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") inchideFormular();
        });
    </script>

</body>
</html>
