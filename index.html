    <title>Black Arrow Belcești</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        img {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .highlight {
            color: #ffcc00;
        }

        p {
            margin-bottom: 30px;
            color: #ccc;
            font-size: 1.1rem;
        }

        .buton-puls {
            background-color: #ffcc00;
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            animation: pulse-animation 2s infinite;
            transition: transform 0.2s;
        }

        .buton-puls:hover {
            transform: scale(1.05);
            background-color: #fff;
            animation: none;
        }

        @keyframes pulse-animation {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 204, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
            }
        }

        div[id*="f230-modal"], .f230-modal {
            width: 95% !important;
            max-width: 1100px !important;
            height: 90vh !important;
            top: 5vh !important;
        }

        iframe[src*="formular230"] {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
